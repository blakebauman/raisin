name: raisin

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raisin
      POSTGRES_PASSWORD: raisin
      POSTGRES_DB: raisin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_better_auth.sql:/docker-entrypoint-initdb.d/002_better_auth.sql:ro
      - ./migrations/003_platform_extras.sql:/docker-entrypoint-initdb.d/003_platform_extras.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raisin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs,sns,ses
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

  api:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: api
    ports:
      - "18080:8080"
    environment:
      DATABASE_URL: postgres://raisin:raisin@postgres:5432/raisin?sslmode=disable
      REDIS_URL: redis://redis:6379
      HTTP_ADDR: ":8080"
      SENDER_DRIVER: mailpit
      MAILPIT_URL: http://mailpit:8025
      JWT_SECRET: dev-jwt-secret-change-me-in-production
      CONSOLE_ORIGIN: http://localhost:3000
      TRACKING_BASE_URL: http://localhost:18081
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /data/attachments
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: worker
    ports:
      - "18081:8081"
    environment:
      DATABASE_URL: postgres://raisin:raisin@postgres:5432/raisin?sslmode=disable
      REDIS_URL: redis://redis:6379
      WORKER_ADDR: ":8081"
      SENDER_DRIVER: mailpit
      MAILPIT_URL: http://mailpit:8025
      JWT_SECRET: dev-jwt-secret-change-me-in-production
      TRACKING_BASE_URL: http://localhost:18081
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /data/attachments
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/raisin-ses-events
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      localstack:
        condition: service_started

  smtp:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: smtp
    ports:
      - "2525:2525"
    environment:
      DATABASE_URL: postgres://raisin:raisin@postgres:5432/raisin?sslmode=disable
      REDIS_URL: redis://redis:6379
      SMTP_ADDR: ":2525"
      JWT_SECRET: dev-jwt-secret-change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    profiles: ["apps"]
    build:
      context: ./apps/console
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18080
      RAISIN_API_URL: http://api:8080
      JWT_SECRET: dev-jwt-secret-change-me-in-production
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dev-better-auth-secret
      DATABASE_URL: postgres://raisin:raisin@postgres:5432/raisin?sslmode=disable
    depends_on:
      - api

volumes:
  pgdata:
  attachments:
