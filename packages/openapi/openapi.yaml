  /templates/{id}/preview:
    get:
      summary: Preview template HTML / react source
      operationId: previewTemplate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /automations:
    post:
      summary: Create automation
      operationId: createAutomation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger_type]
              properties:
                name: { type: string }
                trigger_type: { type: string }
                trigger_filter: { type: object }
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      config: { type: object }
      responses:
        '200':
          description: OK
    get:
      summary: List automations
      operationId: listAutomations
      responses:
        '200':
          description: OK
  /automations/{id}:
    get:
      summary: Get automation
      operationId: getAutomation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
    patch:
      summary: Update automation (enable, steps, trigger_filter, name)
      operationId: updateAutomation
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                name: { type: string }
                description: { type: string }
                trigger_type: { type: string }
                trigger_filter: { type: object }
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      config: { type: object }
      responses:
        '200':
          description: OK
    delete:
      summary: Delete automation
      operationId: deleteAutomation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /automations/{id}/runs:
    get:
      summary: List automation runs
      operationId: listAutomationRuns
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /ip-pools:
    post:
      summary: Create dedicated IP pool
      operationId: createIPPool
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                region: { type: string }
      responses:
        '200':
          description: OK
    get:
      summary: List IP pools
      operationId: listIPPools
      responses:
        '200':
          description: OK
  /ip-pools/{id}:
    get:
      summary: Get IP pool
      operationId: getIPPool
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
    delete:
      summary: Delete IP pool
      operationId: deleteIPPool
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /ip-pools/{id}/pause:
    post:
      summary: Pause IP pool warmup
      operationId: pauseIPPool
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /ip-pools/{id}/resume:
    post:
      summary: Resume IP pool warmup
      operationId: resumeIPPool
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /ip-pools/{id}/warmup/tick:
    post:
      summary: Advance warmup day if due
      operationId: tickIPPoolWarmup
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /ip-pools/{id}/assign-domain:
    post:
      summary: Assign domain to IP pool
      operationId: assignIPPoolDomain
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [domain_id]
              properties:
                domain_id: { type: string, format: uuid }
      responses:
        '200':
          description: OK
  /oauth/apps:
    post:
      summary: Create OAuth app
      operationId: createOAuthApp
      responses:
        '200':
          description: OK
    get:
      summary: List OAuth apps
      operationId: listOAuthApps
      responses:
        '200':
          description: OK
  /oauth/apps/public:
    get:
      summary: Public OAuth app metadata (consent UI)
      security: []
      operationId: oauthPublicApp
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
  /oauth/apps/{id}:
    delete:
      summary: Delete OAuth app
      operationId: deleteOAuthApp
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
  /oauth/authorize:
    post:
      summary: Issue authorization code (console/team JWT)
      operationId: oauthAuthorize
      responses:
        '200':
          description: OK
  /oauth/token:
    post:
      summary: Exchange authorization code or refresh token
      security: []
      operationId: oauthToken
      responses:
        '200':
          description: OK
  /console/token:
    post:
      summary: Mint demo team JWT (dev)
      security: []
      operationId: consoleToken
      responses:
        '200':
          description: OK
  /console/provision:
    post:
      summary: Provision team JWT for console user
      security: []
      operationId: consoleProvision
      responses:
        '200':
          description: OK
  /inbound/ses:
    post:
      summary: SES inbound SNS webhook
      security: []
      operationId: inboundSes
      responses:
        '200':
          description: OK
  /health:
    get:
      summary: Health check
      security: []
      operationId: health
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    SendEmailRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        cc:
          type: array
          items: { type: string }
        bcc:
          type: array
          items: { type: string }
        reply_to:
          type: array
          items: { type: string }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        scheduled_at: { type: string, format: date-time }
        template_id: { type: string, format: uuid }
        tags:
          type: object
          additionalProperties: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              filename: { type: string }
              content_type: { type: string }
              content: { type: string, description: base64 }
              content_id: { type: string }
    Email:
      type: object
      properties:
        id: { type: string, format: uuid }
        from: { type: string }
        to:
          type: array
          items: { type: string }
        subject: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        endpoint: { type: string }
        events:
          type: array
          items: { type: string }
        signing_secret:
          type: string
          description: Only returned on create — store immediately
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
