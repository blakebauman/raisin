        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [svg_url]
              properties:
                selector: { type: string }
                svg_url: { type: string }
                vmc_url: { type: string }
      responses:
        '200':
          description: OK
  /domains/{id}/receiving:
    post:
      summary: Enable or disable inbound receiving
      operationId: setDomainReceiving
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
  /templates/{id}/duplicate:
    post:
      summary: Duplicate template
      operationId: duplicateTemplate
      parameters:
        - $ref: '#/components/parameters/Id'
