apiVersion: apps/v1
kind: Deployment
metadata:
  name: raisin-worker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: raisin-worker
  template:
    metadata:
      labels:
        app: raisin-worker
    spec:
      serviceAccountName: raisin-worker
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - secretRef:
                name: raisin-secrets
            - configMapRef:
                name: raisin-config
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: raisin-worker
spec:
  selector:
    app: raisin-worker
  ports:
    - port: 80
      targetPort: {{ .Values.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raisin-tracking
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: raisin-worker
                port:
                  number: 80
