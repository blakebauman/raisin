global:
  imageRegistry: ""
  domain: raisin.run
  # terraform output -raw app_irsa_role_arn
  irsaRoleArn: ""

networkPolicy:
  enabled: true

# Optional Helm hook Job (secrets must already exist). Prefer api.migrateInit.
migrate:
  enabled: false
  image: postgres:16-alpine

api:
  replicaCount: 2
  image:
    repository: ghcr.io/blakebauman/raisin-api
    tag: latest
  service:
    port: 8080
  migrateInit:
    enabled: true
    image: postgres:16-alpine
  ingress:
    host: api.raisin.run
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: raisin-api-tls
      # e.g. letsencrypt-prod when cert-manager is installed
      clusterIssuer: ""

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/blakebauman/raisin-worker
    tag: latest
  service:
    port: 8081
  ingress:
    host: t.raisin.run
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: raisin-tracking-tls
      clusterIssuer: ""

smtp:
  replicaCount: 1
  image:
    repository: ghcr.io/blakebauman/raisin-smtp
    tag: latest
  service:
    port: 2525
  ingress:
    host: smtp.raisin.run

console:
  replicaCount: 2
  image:
    repository: ghcr.io/blakebauman/raisin-console
    tag: latest
  service:
    port: 3000
  ingress:
    host: app.raisin.run
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: raisin-console-tls
      clusterIssuer: ""
  env:
    RAISIN_API_URL: http://raisin-api
    NEXT_PUBLIC_API_URL: https://api.raisin.run
    BETTER_AUTH_URL: https://app.raisin.run

# Non-secret runtime config → ConfigMap raisin-config
# Wire SQS_EVENTS_QUEUE_URL from: terraform output -raw sqs_events_queue_url
config:
  SENDER_DRIVER: ses
  AWS_REGION: us-east-1
  SES_CONFIGURATION_SET: raisin-prod-events
  # terraform output -raw sns_topic_arn (or ./scripts/helm-values-from-tf.sh)
  SES_SNS_TOPIC_ARN: ""
  CONSOLE_ORIGIN: https://app.raisin.run
  TRACKING_BASE_URL: https://t.raisin.run
  SQS_EVENTS_QUEUE_URL: ""
  S3_BUCKET: raisin-prod-attachments
  S3_INBOUND_BUCKET: raisin-prod-inbound
  STORAGE_DRIVER: s3
  HTTP_ADDR: ":8080"
  WORKER_ADDR: ":8081"
  SMTP_ADDR: ":2525"
  DEFAULT_MONTHLY_QUOTA: "100000"

# Sensitive values → Secret raisin-secrets (override via --set / sealed-secrets / ExternalSecrets)
secrets:
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  BETTER_AUTH_SECRET: ""
