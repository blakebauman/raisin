{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: raisin-migrate-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: raisin
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: raisin-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.migrate.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: raisin-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Running Raisin migrations…"
              for f in /migrations/*.sql; do
                echo "==> $f"
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "Migrations complete."
      volumes:
        - name: migrations
          configMap:
            name: raisin-migrations
{{- end }}
